plugins {
    id "com.android.application"
}

android {
    namespace "com.mbzerker.nbtchat"
    compileSdk 35

    defaultConfig {
        applicationId "com.mbzerker.nbtchat"
        minSdk 26
        targetSdk 35
        versionCode 13
        versionName "0.3.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.zxing:core:3.5.3"
}
