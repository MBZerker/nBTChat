plugins {
    id "com.android.application"
}

def quoteBuildConfig = { value ->
    "\"" + value.toString().replace("\\", "\\\\").replace("\"", "\\\"") + "\""
}
def externalBuildDir = System.getenv("NBTCHAT_GRADLE_BUILD_DIR")
if (externalBuildDir != null && !externalBuildDir.trim().isEmpty()) {
    layout.buildDirectory = file(externalBuildDir)
}
android {
    namespace "com.mbzerker.nbtchat"
    compileSdk 35

    defaultConfig {
        applicationId "com.mbzerker.nbtchat"
        minSdk 26
        targetSdk 35
        versionCode 56
        versionName "0.4.34"
        buildConfigField "String", "NBTCHAT_STORE_BASE_URL", quoteBuildConfig("https://nbtchat-store.nectof.workers.dev")
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.zxing:core:3.5.3"
}
